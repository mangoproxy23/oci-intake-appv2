name: No AI commit trailers
# Fails a pull request if any commit it ADDS carries an AI co-author/session
# trailer or an AI-named author/committer. Scoped to the PR's new commits only,
# so pre-existing history is not re-litigated. Local twin: githooks/commit-msg
# (install per clone: cp githooks/commit-msg .git/hooks/ && chmod +x).
# Rationale: AGENT_POLICY.md - "Commits belong to the person, not the agent".
on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on AI trailers in the PR's new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          bad=0
          if git log --format='%H %s%n%b' "$BASE..HEAD" \
              | grep -inE '^(co-authored-by:.*(claude|anthropic|copilot|chatgpt|openai)|(claude|ai)-session:)'; then
            echo '::error::A commit in this PR carries an AI co-author/session trailer. See AGENT_POLICY.md.'
            bad=1
          fi
          if git log --format='%h author:%an <%ae> committer:%cn <%ce>' "$BASE..HEAD" \
              | grep -iE '(claude|anthropic\.com|copilot|chatgpt)'; then
            echo '::error::A commit in this PR has an AI-named author or committer. See AGENT_POLICY.md.'
            bad=1
          fi
          [ "$bad" -eq 0 ] && echo "New commits are clean."
          exit "$bad"
